pre-commit:
  parallel: true
  commands:
    go-format:
      glob: "**/*.go"
      # golangci-lint fmt applies the formatters configured in .golangci.yml
      # (gofmt + goimports) — the same set CI enforces — so a commit can't pass
      # the hook with import ordering that would later fail the lint job.
      run: golangci-lint fmt {staged_files}
      stage_fixed: true
      skip: merge

pre-push:
  piped: true
  commands:
    # First, so a push carrying a denylisted term is refused before slower
    # checks run. It warns rather than fails where the denylist is absent,
    # since the denylist lives outside the repository by design. {1} is the
    # destination remote and stdin lists the refs being pushed (githooks(5),
    # pre-push), so it sweeps what this push publishes rather than HEAD. No
    # merge skip: a guard against publishing has no state in which to stand
    # down.
    disclosure-sweep:
      priority: 1
      run: go run ./internal/devtools/sweep --pre-push {1}
      use_stdin: true
    go-lint:
      priority: 2
      run: just lint
      skip: merge
    go-test:
      priority: 3
      # The same form CI runs, so a push that passes here cannot fail CI's test
      # job for a reason the hook never checked.
      run: just test-race
      skip: merge
